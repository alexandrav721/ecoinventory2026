<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loop ad — It earns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Archivo:wght@400;600;700&display=swap">
<link rel="stylesheet" href="./ad.css">
</head>
<body>
<div class="ad ad--champagne">
  <div>
    <p class="eyebrow">Now in FiDi</p>
    <h1 class="display" style="margin-top:38px">Your closet is<br>a <em>shop</em> you<br>already paid for.</h1>
    <p class="sub">Lend the drill. Rent the suitcase. Keep the good stuff moving.</p>
  </div>
  <div class="tiles" style="grid-template-columns:repeat(3,1fr)">
    <div class="tile" style="background:#D9823B"><div class="name" style="color:#fff">Power drill</div><div><span class="tag tag--rent">$8 / day</span></div></div>
    <div class="tile" style="background:#3E4C7A"><div class="name" style="color:#fff">Suitcase</div><div><span class="tag tag--rent">$14 / week</span></div></div>
    <div class="tile" style="background:#4F7F4A"><div class="name" style="color:#fff">Camping tent</div><div><span class="tag tag--rent">$12 / weekend</span></div></div>
  </div>
  <div class="foot">
    <div class="lockup"><svg width="54" height="54" viewBox="0 0 1024 1024" aria-hidden>
        <rect width="1024" height="1024" rx="230" fill="#8C2E48"/>
        <path d="M 805 405 A 312 312 0 1 1 619 219" fill="none" stroke="#F7F2EA" stroke-width="30" stroke-linecap="round"/>
        <path d="M 380 326 L 380 698 L 658 698" fill="none" stroke="#FFFFFF" stroke-width="88" stroke-linecap="round" stroke-linejoin="round"/>
      </svg><span class="word">Loop</span></div>
    <div class="where">Borrow, lend and rent on your block. FiDi, New York.</div>
  </div>
</div>
</body>
</html>
