<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loop ad — Ask your block</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Archivo:wght@400;600;700&display=swap">
<link rel="stylesheet" href="./ad.css">
</head>
<body>
<div class="ad">
  <div>
    <p class="eyebrow">Before you buy it</p>
    <h1 class="display" style="margin-top:38px">Somebody on<br>your block<br>already <em>owns one</em>.</h1>
    <p class="sub">Ask, borrow it for the weekend, and don't buy a thing you'd use twice.</p>
  </div>
  <div style="border:1px solid var(--hairline);border-radius:26px;padding:40px 44px;background:#fff">
    <div style="font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:#99938C">Asking nearby</div>
    <div style="font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:58px;margin-top:14px">"Does anyone have a carpet cleaner?"</div>
    <div style="font-size:24px;color:#5F5A54;margin-top:18px">Three neighbours do.</div>
  </div>
  <div class="foot">
    <div class="lockup"><svg width="54" height="54" viewBox="0 0 1024 1024" aria-hidden>
        <rect width="1024" height="1024" rx="230" fill="#8C2E48"/>
        <path d="M 805 405 A 312 312 0 1 1 619 219" fill="none" stroke="#F7F2EA" stroke-width="30" stroke-linecap="round"/>
        <path d="M 380 326 L 380 698 L 658 698" fill="none" stroke="#FFFFFF" stroke-width="88" stroke-linecap="round" stroke-linejoin="round"/>
      </svg><span class="word">Loop</span></div>
    <div class="where">Borrow, lend and rent on your block. FiDi, New York.</div>
  </div>
</div>
</body>
</html>
