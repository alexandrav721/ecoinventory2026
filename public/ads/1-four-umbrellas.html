<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loop ad — Four umbrellas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Archivo:wght@400;600;700&display=swap">
<link rel="stylesheet" href="./ad.css">

<body>
<div class="ad">
  <div>
    <p class="eyebrow">Now in FiDi</p>
    <h1 class="display" style="margin-top:38px">You already own<br><em>four umbrellas</em>.</h1>
    <p class="sub">Three are in the hall closet. You were about to buy a fifth.</p>
  </div>
  <div style="display:flex;align-items:flex-end;gap:30px;margin-bottom:40px">
    <div style="width:164px;height:204px;border-radius:22px;background:#D8A48F"></div>
    <div style="width:164px;height:204px;border-radius:22px;background:#D8A48F;opacity:.34"></div>
    <div style="width:164px;height:204px;border-radius:22px;background:#D8A48F;opacity:.22"></div>
    <div style="width:164px;height:204px;border-radius:22px;background:#D8A48F;opacity:.14"></div>
    <div style="position:relative;width:164px;height:204px;border-radius:22px;border:3px dashed #8C2E48">
      <span style="position:absolute;left:50%;top:50%;width:182px;height:4px;background:#8C2E48;transform:translate(-50%,-50%) rotate(-24deg)"></span>
    </div>
  </div>
  <div class="foot">
    <div class="lockup"><svg width="54" height="54" viewBox="0 0 1024 1024" aria-hidden>
        <rect width="1024" height="1024" rx="230" fill="#8C2E48"/>
        <path d="M 805 405 A 312 312 0 1 1 619 219" fill="none" stroke="#F7F2EA" stroke-width="30" stroke-linecap="round"/>
        <path d="M 380 326 L 380 698 L 658 698" fill="none" stroke="#FFFFFF" stroke-width="88" stroke-linecap="round" stroke-linejoin="round"/>
      </svg><span class="word">Loop</span></div>
    <div class="where">Borrow, lend and rent on your block. FiDi, New York.</div>
  </div>
</div>
